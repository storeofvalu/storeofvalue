<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store of Value - Bitcoin Education & Resources</title>
    
    <!-- Dev cache control -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Favicon and PWA support -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#f97316">
    <meta name="msapplication-TileColor" content="#f97316">
    
    <!-- Basic SEO -->
    <meta name="description" content="Store of Value: Explore the transformative power of Bitcoin through multiple perspectives, educational resources, and community insights.">
    <meta name="keywords" content="bitcoin, cryptocurrency, blockchain, education, digital currency, investment, finance, store of value">
    <meta name="author" content="Store of Value">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Store of Value - Bitcoin Education & Resources">
    <meta property="og:description" content="Explore the transformative power of Bitcoin through multiple perspectives, educational resources, and community insights.">
    <meta property="og:image" content="/images/Store-of-Value_OG-image-hope.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://storeofvalue.ch">
    <meta property="og:site_name" content="Store of Value">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@storeofvalue_ch">
    <meta name="twitter:title" content="Store of Value - Bitcoin Education & Resources">
    <meta name="twitter:description" content="Explore the transformative power of Bitcoin through multiple perspectives, educational resources, and community insights.">
    <meta name="twitter:image" content="/images/Store-of-Value_OG-image-hope.jpg">
    
    <!-- Preload fonts -->
    <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(registration => {
              console.log('Service Worker registered with scope:', registration.scope);
            })
            .catch(error => {
              console.error('Service Worker registration failed:', error);
            });
        });
      }
    </script>
    
    <!-- Hidden Netlify forms for form handling -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="subject"></select>
      <textarea name="message"></textarea>
    </form>
    
    <form name="community" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="interests"></textarea>
    </form>
    
    <form name="get-started-log" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="knowledgeLevel" />
      <input type="text" name="motivation" />
      <input type="text" name="interests" />
      <input type="text" name="timestamp" />
    </form>
  </body>
</html>
