<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline - Bitcoin Education</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #f8f9fa;
      color: #333;
    }
    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.2rem;
      max-width: 500px;
      line-height: 1.6;
      margin-bottom: 2rem;
      color: #666;
    }
    .button {
      display: inline-block;
      background-color: #f97316;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    .button:hover {
      background-color: #ea580c;
    }
    .bitcoin-symbol {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #f97316;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="bitcoin-symbol">₿</div>
    <h1>You're Currently Offline</h1>
    <p>
      It seems you don't have an internet connection right now. 
      The Bitcoin Education site requires an active connection to access all content.
    </p>
    <a href="/" class="button">Try Again</a>
  </div>
</body>
</html>
